<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snipe - GitHub Username Checker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117; color: #c9d1d9; padding: 20px;
            max-width: 1200px; margin: 0 auto;
        }
        h1 { text-align: center; color: #58a6ff; margin-bottom: 20px; font-size: 1.5rem; }
        .settings {
            background: #161b22; border: 1px solid #30363d; border-radius: 6px;
            padding: 15px; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
        }
        .settings label { font-size: 0.85rem; color: #8b949e; }
        .settings input[type="file"] {
            background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
            padding: 6px; border-radius: 4px; font-size: 0.85rem;
        }
        .settings input[type="number"] {
            background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
            padding: 6px; border-radius: 4px; width: 90px; font-size: 0.85rem;
        }
        .settings input[type="checkbox"] { width: auto; cursor: pointer; }
        .file-status { font-size: 0.8rem; color: #3fb950; margin-top: 5px; width: 100%; }
        .file-status.err { color: #f85149; }
        .controls { text-align: center; margin-bottom: 20px; }
        button {
            background: #238636; color: white; border: none; padding: 10px 24px;
            border-radius: 6px; cursor: pointer; font-size: 1rem; margin: 5px;
        }
        button:hover { background: #2ea043; }
        button:disabled { background: #30363d; cursor: not-allowed; }
        #pauseBtn { background: #d29922; }
        #pauseBtn:hover { background: #e3a857; }
        #stopBtn { background: #da3633; }
        #stopBtn:hover { background: #f85149; }
        #exportBtn { background: #58a6ff; }
        #exportBtn:hover { background: #79b8ff; }
        #retryFailedBtn { background: #8957e5; }
        #retryFailedBtn:hover { background: #a371f7; }
        .progress-bar { width: 100%; height: 8px; background: #21262d; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: #58a6ff; width: 0%; transition: width 0.3s; }
        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .stat { background: #161b22; padding: 10px 16px; border-radius: 6px; border: 1px solid #30363d; text-align: center; }
        .stat span { display: block; font-size: 1.4rem; font-weight: bold; color: #58a6ff; }
        .stat.available span { color: #3fb950; }
        .stat.taken span { color: #f85149; }
        .stat.error span { color: #d29922; }
        .stat.failed span { color: #8957e5; }
        .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 15px; }
        .result-item { padding: 8px; border-radius: 4px; text-align: center; font-size: 0.85rem; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
        .result-item.available { background: rgba(46,160,67,0.15); border: 1px solid #3fb950; color: #3fb950; }
        .result-item.taken { background: rgba(248,81,73,0.1); border: 1px solid #f85149; color: #f85149; }
        .result-item.checking { background: rgba(88,166,255,0.1); border: 1px solid #58a6ff; color: #58a6ff; animation: pulse 1s infinite; }
        .result-item.error { background: rgba(210,153,34,0.1); border: 1px solid #d29922; color: #d29922; }
        .result-item.failed { background: rgba(137,87,229,0.1); border: 1px solid #8957e5; color: #8957e5; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        .log { margin-top: 20px; padding: 15px; background: #161b22; border-radius: 6px; border: 1px solid #30363d; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; }
        .log p { margin: 3px 0; }
        .log .info { color: #58a6ff; }
        .log .success { color: #3fb950; }
        .log .fail { color: #f85149; }
        .log .warn { color: #d29922; }
        .log .error { color: #8957e5; }
        .mode-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-left: 10px; vertical-align: middle; }
        .mode-badge.retry { background: rgba(137,87,229,0.2); color: #8957e5; border: 1px solid #8957e5; }
        .mode-badge.normal { background: rgba(88,166,255,0.2); color: #58a6ff; border: 1px solid #58a6ff; }
        .toggle-hint { font-size: 0.72rem; color: #6e7681; margin-left: 4px; }
    </style>
</head>
<body>
    <h1>🎯 Snipe <span id="modeBadge" class="mode-badge normal">NORMAL</span></h1>
    
    <div class="settings">
        <div>
            <label>Username file (.txt, one per line):</label><br>
            <input type="file" id="fileInput" accept=".txt">
            <div id="fileStatus" class="file-status"></div>
        </div>
        <div>
            <label>Start index:</label><br>
            <input type="number" id="startIdx" value="0" min="0">
        </div>
        <div>
            <label>Parallel:</label><br>
            <input type="number" id="parallel" value="3" min="1" max="5">
        </div>
        <div>
            <label>Delay (ms):</label><br>
            <input type="number" id="delayMs" value="800" min="200">
        </div>
        <div>
            <label>403 Wait (sec):</label><br>
            <input type="number" id="rateLimitWait" value="60" min="10">
        </div>
        <div>
            <label>Max Retries:</label><br>
            <input type="number" id="maxRetries" value="3" min="1" max="10">
        </div>
        <div>
            <label>Auto-pause after:</label><br>
            <input type="number" id="failThreshold" value="5" min="2" max="20">
        </div>
        <div style="display:flex; align-items:center; gap:6px; margin-top:5px;">
            <input type="checkbox" id="persistRateLimit" checked>
            <label for="persistRateLimit">Persist 403 timer across pause</label>
            <span class="toggle-hint">(uncheck to cancel timer instantly — e.g. after IP switch)</span>
        </div>
    </div>

    <div class="controls">
        <button id="startBtn" onclick="startCheck()" disabled>Start</button>
        <button id="pauseBtn" onclick="pauseCheck()" disabled>Pause</button>
        <button id="stopBtn" onclick="stopCheck()" disabled>Stop</button>
        <button id="retryFailedBtn" onclick="retryFailed()" disabled>Retry Failed</button>
        <button id="backToFullBtn" onclick="backToFullList()" style="display:none;">Back to Full List</button>
        <button id="exportBtn" onclick="exportLog()">Export Log</button>
        <button id="exportAvailBtn" onclick="exportAvailable()">Export Available</button>
        <button id="exportFailedBtn" onclick="exportFailed()">Export Failed</button>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="stats">
        <div class="stat"><span id="totalChecked">0</span>Checked</div>
        <div class="stat available"><span id="availableCount">0</span>Available</div>
        <div class="stat taken"><span id="takenCount">0</span>Taken</div>
        <div class="stat error"><span id="errorCount">0</span>Errors</div>
        <div class="stat failed"><span id="failedCount">0</span>Failed</div>
        <div class="stat"><span id="remainingCount">0</span>Remaining</div>
    </div>

    <div class="results" id="results"></div>
    <div class="log" id="log"></div>

    <script>
        let usernames = [];
        let originalUsernames = [];
        let isRunning = false;
        let isPaused = false;
        let currentIndex = 0;
        let checked = 0, available = 0, taken = 0, errors = 0;
        let availableList = [];
        let failedList = [];
        let logEntries = [];
        let activeWorkers = 0;
        let shouldStop = false;
        let consecutiveFailures = 0;
        let isRetryMode = false;
        let cancelRateLimit = false;
        const activeControllers = new Set();

        document.getElementById('persistRateLimit').addEventListener('change', (e) => {
            if (!e.target.checked) {
                cancelRateLimit = true;
                log('⚡ Persist OFF — active 403 timer cancelled. Switch IP & resume.', 'warn');
            } else {
                cancelRateLimit = false;
                log('Persist ON — 403 timers will freeze on pause.', 'info');
            }
        });

        function delay(ms) {
            return new Promise(resolve => {
                let elapsed = 0;
                const tick = 100;
                const timer = setInterval(() => {
                    if (shouldStop || !isPaused) elapsed += tick;
                    if (elapsed >= ms || shouldStop) {
                        clearInterval(timer);
                        resolve();
                    }
                }, tick);
            });
        }

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const text = await file.text();
            const loaded = text.split('\n').map(u => u.trim()).filter(u => u.length > 0 && !u.startsWith('#'));
            const status = document.getElementById('fileStatus');
            if (loaded.length === 0) {
                status.className = 'file-status err';
                status.textContent = 'No valid usernames found.';
                document.getElementById('startBtn').disabled = true;
            } else {
                usernames = [...loaded];
                originalUsernames = [...loaded];
                status.className = 'file-status';
                status.textContent = `Loaded ${loaded.length} usernames.`;
                document.getElementById('startIdx').max = loaded.length - 1;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('remainingCount').textContent = loaded.length;
                checked = 0; available = 0; taken = 0; errors = 0;
                availableList = []; failedList = [];
                document.getElementById('results').innerHTML = '';
                updateStats();
            }
        });

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            logEntries.push({ time, msg, type });
            const logEl = document.getElementById('log');
            const p = document.createElement('p');
            p.className = type;
            p.textContent = `[${time}] ${msg}`;
            logEl.appendChild(p);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateStats() {
            document.getElementById('totalChecked').textContent = checked;
            document.getElementById('availableCount').textContent = available;
            document.getElementById('takenCount').textContent = taken;
            document.getElementById('errorCount').textContent = errors;
            document.getElementById('failedCount').textContent = failedList.length;
            document.getElementById('remainingCount').textContent = Math.max(0, usernames.length - checked);
            document.getElementById('progressFill').style.width = usernames.length > 0 ? `${(checked / usernames.length) * 100}%` : '0%';
        }

        function getResultEl(username) {
            let el = document.getElementById(`res-${username}`);
            if (!el) {
                const resultsEl = document.getElementById('results');
                el = document.createElement('div');
                el.id = `res-${username}`;
                el.className = 'result-item checking';
                el.textContent = username;
                resultsEl.appendChild(el);
            }
            return el;
        }

        function markSuccess() { consecutiveFailures = 0; }

        function markFailure() {
            consecutiveFailures++;
            const threshold = parseInt(document.getElementById('failThreshold').value) || 5;
            if (consecutiveFailures >= threshold && isRunning && !isPaused) {
                isPaused = true;
                document.getElementById('pauseBtn').textContent = 'Resume';
                log(`⚠ ${consecutiveFailures} consecutive failures — auto-paused. Fix connection & resume.`, 'error');
            }
        }

        async function checkSingle(username, retryAttempt) {
            const el = getResultEl(username);
            el.className = 'result-item checking';
            const tag = retryAttempt > 0 ? ` (r${retryAttempt})` : '';
            const controller = new AbortController();
            activeControllers.add(controller);
            try {
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                const resp = await fetch(`https://api.github.com/users/${username}`, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                activeControllers.delete(controller);

                if (resp.status === 404) {
                    el.className = 'result-item available'; el.textContent = `✓ ${username}`;
                    available++; if (!availableList.includes(username)) availableList.push(username);
                    log(`${username}${tag} → AVAILABLE`, 'success'); markSuccess(); return { status: 'ok' };
                } else if (resp.status === 200) {
                    el.className = 'result-item taken'; el.textContent = `✗ ${username}`;
                    taken++; log(`${username}${tag} → taken`, 'fail'); markSuccess(); return { status: 'taken' };
                } else if (resp.status === 403) {
                    el.className = 'result-item error'; el.textContent = `⚠ ${username}`;
                    log(`${username}${tag} → 403 rate limit`, 'warn'); markFailure(); return { status: 'rate_limit' };
                } else if (resp.status >= 500 || resp.status === 429) {
                    el.className = 'result-item error'; el.textContent = `? ${username} (${resp.status})`;
                    log(`${username}${tag} → HTTP ${resp.status} — retry`, 'warn'); markFailure(); return { status: 'retry' };
                } else {
                    el.className = 'result-item error'; el.textContent = `? ${username} (${resp.status})`;
                    errors++; log(`${username}${tag} → HTTP ${resp.status} — not retryable`, 'warn'); markSuccess(); return { status: 'error' };
                }
            } catch (e) {
                activeControllers.delete(controller);
                el.className = 'result-item error';
                const reason = e.name === 'AbortError' ? 'timeout' : 'network error';
                log(`${username}${tag} → ${reason} — retry`, 'warn'); markFailure(); return { status: 'retry' };
            }
        }

        async function worker() {
            const delayMs = parseInt(document.getElementById('delayMs').value) || 800;
            const maxRetries = parseInt(document.getElementById('maxRetries').value) || 3;
            const persistRL = () => document.getElementById('persistRateLimit').checked;

            while (!shouldStop && currentIndex < usernames.length) {
                if (isPaused) { await delay(300); continue; }

                const idx = currentIndex++;
                const name = usernames[idx];
                if (!name) continue;

                let retries = 0;
                let retryImmediately = false;

                while (retries <= maxRetries && !shouldStop) {
                    if (isPaused) { await delay(300); continue; }

                    const result = await checkSingle(name, retries);

                    if (result.status === 'ok' || result.status === 'taken' || result.status === 'error') break;

                    if (result.status === 'rate_limit') {
                        currentIndex = idx;
                        const waitSec = parseInt(document.getElementById('rateLimitWait').value) || 60;
                        log(`Rate limit — waiting ${waitSec}s...`, 'warn');

                        for (let s = waitSec; s > 0 && !shouldStop && !cancelRateLimit; s--) {
                            if (isPaused && persistRL()) {
                                await delay(1000);
                            } else if (isPaused && !persistRL()) {
                                break;
                            } else {
                                await delay(1000);
                            }
                        }

                        if (cancelRateLimit) {
                            log('⚡ 403 timer cancelled. Retrying immediately.', 'warn');
                            cancelRateLimit = false;
                            retries = 0;
                            retryImmediately = true;
                            break;
                        }

                        retries = 0;
                        continue;
                    }

                    if (result.status === 'retry') {
                        retries++;
                        if (retries <= maxRetries) await delay(delayMs * Math.pow(2, retries - 1));
                    }
                }

                if (retryImmediately && !shouldStop) {
                    currentIndex = idx;
                    continue;
                }

                if (retries > maxRetries && !shouldStop) {
                    const el = getResultEl(name);
                    el.className = 'result-item failed'; el.textContent = `✕ ${name}`;
                    if (!failedList.includes(name)) failedList.push(name);
                    document.getElementById('retryFailedBtn').disabled = false;
                }

                checked++; updateStats();
                await delay(delayMs);
            }

            activeWorkers--;
            if (activeWorkers === 0) {
                isRunning = false;
                if (isRetryMode) {
                    log(`Retry done — Available: ${available}, Taken: ${taken}, Still failed: ${failedList.length}`, 'info');
                    isRetryMode = false;
                    document.getElementById('modeBadge').textContent = 'NORMAL';
                    document.getElementById('modeBadge').className = 'mode-badge normal';
                    document.getElementById('backToFullBtn').style.display = 'inline-block';
                } else {
                    log(`Done — Available: ${available}, Taken: ${taken}, Errors: ${errors}, Failed: ${failedList.length}`, 'info');
                }
                document.getElementById('startBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('pauseBtn').textContent = 'Pause';
            }
        }

        function startCheck() {
            if (isRunning) return;
            if (usernames.length === 0) { log('Load a file first!', 'warn'); return; }
            const startIdx = parseInt(document.getElementById('startIdx').value) || 0;
            const parallel = Math.min(5, Math.max(1, parseInt(document.getElementById('parallel').value) || 3));
            if (startIdx >= usernames.length) { log('Start index out of range!', 'warn'); return; }

            isRunning = true; isPaused = false; shouldStop = false; cancelRateLimit = false;
            currentIndex = startIdx; consecutiveFailures = 0;

            if (startIdx === 0 && checked === 0) { available = 0; taken = 0; errors = 0; availableList = []; failedList = []; }

            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('retryFailedBtn').disabled = true;
            document.getElementById('pauseBtn').textContent = 'Pause';

            log(`▶ Snipe started — ${parallel} workers from index ${startIdx} (retries: ${document.getElementById('maxRetries').value})`, 'info');
            activeWorkers = parallel;
            for (let w = 0; w < parallel; w++) worker();
        }

        function pauseCheck() {
            if (!isRunning) return;
            isPaused = !isPaused;

            if (isPaused) {
                activeControllers.forEach(c => c.abort());
                activeControllers.clear();
                if (!document.getElementById('persistRateLimit').checked) {
                    cancelRateLimit = true;
                }
            }

            document.getElementById('pauseBtn').textContent = isPaused ? 'Resume' : 'Pause';
            log(isPaused ? `⏸ Paused at index ${currentIndex}.` : '▶ Resumed.', 'warn');
        }

        function stopCheck() {
            shouldStop = true; isRunning = false; isPaused = false; cancelRateLimit = true;
            activeControllers.forEach(c => c.abort());
            activeControllers.clear();
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('retryFailedBtn').disabled = failedList.length === 0;
            document.getElementById('pauseBtn').textContent = 'Pause';
            log(`⏹ Stopped at index ${currentIndex}.`, 'warn');
        }

        function retryFailed() {
            if (failedList.length === 0) { log('No failed names!', 'warn'); return; }
            if (isRunning) { log('Already running!', 'warn'); return; }

            const toRetry = [...failedList];
            failedList = [];
            checked = 0;
            toRetry.forEach(n => { const el = document.getElementById(`res-${n}`); if (el) el.remove(); });

            usernames = [...toRetry];
            currentIndex = 0;
            isRetryMode = true;

            document.getElementById('modeBadge').textContent = `RETRY (${toRetry.length})`;
            document.getElementById('modeBadge').className = 'mode-badge retry';
            document.getElementById('backToFullBtn').style.display = 'none';
            updateStats();

            isRunning = true; isPaused = false; shouldStop = false; cancelRateLimit = false; consecutiveFailures = 0;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('retryFailedBtn').disabled = true;
            document.getElementById('pauseBtn').textContent = 'Pause';

            log(`🔄 Retrying ${toRetry.length} failed names...`, 'info');
            const parallel = Math.min(5, Math.max(1, parseInt(document.getElementById('parallel').value) || 3));
            activeWorkers = parallel;
            for (let w = 0; w < parallel; w++) worker();
        }

        function backToFullList() {
            if (isRunning) return;
            usernames = [...originalUsernames];
            currentIndex = 0;
            checked = 0;
            document.getElementById('backToFullBtn').style.display = 'none';
            document.getElementById('modeBadge').textContent = 'NORMAL';
            document.getElementById('modeBadge').className = 'mode-badge normal';
            updateStats();
            log('Restored full list.', 'info');
        }

        function exportLog() {
            if (!logEntries.length) { alert('No log.'); return; }
            const blob = new Blob([logEntries.map(e => `[${e.time}] ${e.msg}`).join('\n')], { type: 'text/plain' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `snipe-log-${Date.now()}.txt`; a.click();
        }
        function exportAvailable() {
            if (!availableList.length) { alert('None available.'); return; }
            const blob = new Blob([availableList.join('\n')], { type: 'text/plain' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `snipe-available-${Date.now()}.txt`; a.click();
        }
        function exportFailed() {
            if (!failedList.length) { alert('No failed names.'); return; }
            const blob = new Blob([failedList.join('\n')], { type: 'text/plain' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `snipe-failed-${Date.now()}.txt`; a.click();
        }
    </script>
</body>
</html>
